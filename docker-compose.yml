services:
  # Local PostgreSQL instance matching the production database engine
  postgres:
    image: postgres:16-alpine
    container_name: e-template-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e_template
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d e_template"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Production-like Next.js application container
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e-template-web
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/e_template"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY:-}"
      SSL_COMMERZ_STORE_ID: "${SSL_COMMERZ_STORE_ID:-}"
      SSL_COMMERZ_STORE_PASSWORD: "${SSL_COMMERZ_STORE_PASSWORD:-}"
      SSL_COMMERZ_API_URL: "${SSL_COMMERZ_API_URL:-https://sandbox.sslcommerz.com/gwprocess/v4/api.php}"
      SSL_COMMERZ_VALIDATION_URL: "${SSL_COMMERZ_VALIDATION_URL:-https://sandbox.sslcommerz.com/validator/api/validationApi.php}"
    restart: unless-stopped

volumes:
  postgres_data:

